[project]
name = "hyprcu"
version = "0.11.0"
description = "Hyprland computer use: dialog-free MCP server + CLI for AI agents (hypruse fork)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ilyas Khallouki", email = "khalloukielias@gmail.com" }]
keywords = ["hyprland", "mcp", "wayland", "computer-use", "automation", "ai-agents", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: Window Managers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jeepney>=0.8",
    "mcp>=1.2,<2",
]

[project.urls]
Homepage = "https://github.com/angusforbes/hyprcu"

[project.scripts]
hyprcu = "hyprcu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyprcu"]

# the Agent Skill ships inside the package, so `hyprcu skill install` always
# describes the verbs the installed binary has
[tool.hatch.build.targets.sdist]
include = [
    "/src/hyprcu", "/tests",
    "/README.md", "/LICENSE", "/CHANGELOG.md", "/ARCHITECTURE.md", "/CONTRIBUTING.md",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: needs a live Hyprland session"]
addopts = "-m 'not e2e'"
